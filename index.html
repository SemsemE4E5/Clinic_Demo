<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>عيادة الشفاء — نظام الإدارة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d9488"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="عيادة الشفاء">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0d9488;--p2:#2dd4bf;--pl:#e4f5f2;--bg:#f2f8f7;--card:#fff;--tx:#10292d;--mu:#5d7a7e;--bd:#dfeceb;--ok:#15803d;--wn:#b45309;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1517;--card:#122125;--tx:#e6f2f2;--mu:#8fadb0;--bd:#223a3f;--pl:#12332f}}
:root[data-theme=dark]{--bg:#0b1517;--card:#122125;--tx:#e6f2f2;--mu:#8fadb0;--bd:#223a3f;--pl:#12332f}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;height:100%;font:14px/1.6 Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h3,h4{margin:.3em 0 .6em}
.app{display:flex;height:100%}
.sb{width:240px;background:var(--card);border-inline-end:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:4px;transition:width .25s;overflow:hidden;flex-shrink:0}
.col .sb{width:68px}.col .sb span{display:none}
.logo{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;font-weight:700;font-size:16px;color:var(--p);white-space:nowrap}
.logo i{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;flex-shrink:0}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;white-space:nowrap;border:0;background:0;font:inherit;width:100%;text-align:start}
.nv:hover,.nv.on{background:var(--pl)}.nv.on{color:var(--p);font-weight:700}.nv b{font-size:18px;width:24px;text-align:center;font-weight:400;flex-shrink:0}
.mn{flex:1;min-width:0;overflow:auto}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 22px}
.top h1{font-size:18px;margin:0}.top small{color:var(--mu);flex:1}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
#v{padding:22px;max-width:1200px;margin:auto}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.st{display:flex;gap:14px;align-items:center}.st i{width:46px;height:46px;border-radius:12px;background:var(--pl);display:grid;place-items:center;font-size:22px;font-style:normal}.st small{color:var(--mu)}.st b{font-size:22px;display:block;line-height:1.3}
.bt{background:linear-gradient(135deg,var(--p),#14b8a6);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.bt.s{background:var(--pl);color:var(--p)}.bt.d{background:#fee2e2;color:var(--er)}.bt.x{padding:3px 10px;font-size:12px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
:focus-visible{outline:2px solid var(--p2);outline-offset:1px}
table{width:100%;border-collapse:collapse}th{color:var(--mu);font-weight:600;text-align:start;font-size:12px}td,th{padding:10px 8px;border-bottom:1px solid var(--bd)}tr.k{cursor:pointer}tr.k:hover{background:var(--pl)}
.tw{overflow-x:auto}
.tg{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--pl);color:var(--p);white-space:nowrap}.tg.w{background:#fef3c7;color:var(--wn)}.tg.e{background:#fee2e2;color:var(--er)}.tg.o{background:#dcfce7;color:var(--ok)}
.bar{display:flex;align-items:flex-end;gap:10px;height:160px}.bar div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bar span{background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0;display:block;min-height:3px}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}#m.on{display:flex}
.md{background:var(--card);border-radius:16px;padding:22px;width:min(640px,100%);max-height:92%;overflow:auto}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.rw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl{border-inline-start:2px solid var(--p2);padding:0 14px 10px;margin-inline-start:6px}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:99px;display:none;z-index:60}
@media(max-width:800px){.sb{position:fixed;z-index:40;inset:0 0 0 auto;transform:translateX(100%);width:240px!important}.open .sb{transform:none}.col .sb span{display:inline}#v{padding:14px}.f{grid-template-columns:1fr}.top{padding:10px 14px}}
@media print{body>*{display:none!important}#m{display:block!important;position:static;background:none}.nb{display:none!important}.md{background:#fff!important;color:#000!important}}
</style></head><body>
<div class="app" id="app"><aside class="sb"><div class="logo"><i>✚</i><span id="cn"></span></div><div id="nav"></div><div style="flex:1"></div><button class="nv" onclick="rs()"><b>🔄</b><span>إعادة البيانات التجريبية</span></button></aside>
<div class="mn"><header class="top"><button class="ib" onclick="tg()" aria-label="القائمة">☰</button><h1 id="ti"></h1><small id="dt"></small><button class="bt" onclick="vf(0)">+ فاتورة</button><button class="ib" onclick="th()" aria-label="الوضع">🌓</button><div class="av">د</div></header><div id="v"></div></div></div>
<div id="m" onclick="if(event.target===this)cm()"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString('en-CA')},money=n=>n.toLocaleString('ar-EG')+' ج.م';

let cart=[],pt=0,S,P0,cur='d',q='',ad=iso(0);
const idb=()=>P0||(P0=new Promise((res,rej)=>{try{const r=indexedDB.open('clinic',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=rej}catch(e){rej(e)}}));
async function load(){try{const db=await idb();return await new Promise(r=>{const g=db.transaction('k').objectStore('k').get('s');g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const db=await idb();db.transaction('k','readwrite').objectStore('k').put(S,'s')}catch(e){}}
function seed(){const N=[['أحمد محمد علي',34,'ذكر',''],['منى السيد',28,'أنثى','عميلة دائمة'],['محمود إبراهيم',52,'ذكر',''],['سارة حسن',9,'أنثى',''],['يوسف عبد الله',41,'ذكر',''],['نور الهدى',23,'أنثى',''],['خالد مصطفى',60,'ذكر','تأمين'],['هبة أحمد',36,'أنثى',''],['عمر طارق',15,'ذكر',''],['ليلى كمال',47,'أنثى','']];
S={clinic:'عيادة الشفاء',n:100,svc:[{n:'كشف',p:200},{n:'استشارة',p:150},{n:'إعادة كشف',p:100},{n:'تحليل',p:120},{n:'أشعة',p:250},{n:'جلسة',p:300}],patients:N.map((p,i)=>({id:i+1,name:p[0],age:p[1],sex:p[2],notes:p[3],phone:'010'+String(10000000+i*7391234)})),appts:[],visits:[]};
['حضر','محجوز','محجوز','محجوز','ألغى','انتهى'].forEach((s,i)=>S.appts.push({id:200+i,pid:i+1,date:iso(0),time:'1'+i+':00',type:i%2?'استشارة':'كشف',status:s}));
S.appts.push({id:210,pid:7,date:iso(1),time:'11:30',type:'متابعة',status:'محجوز'});
for(let i=0;i<16;i++){const a=S.svc[i%3],b=i%4==0?S.svc[3]:null,it=[{n:a.n,p:a.p,q:1}];if(b)it.push({n:b.n,p:b.p,q:1});const t=it.reduce((s,x)=>s+x.p*x.q,0);S.visits.push({id:300+i,pid:i%10+1,date:iso(-(i>>1)),items:it,disc:0,m:['نقدي','نقدي','فيزا','تحويل'][i%4],fee:t,paid:i%7==3?t-100:t})}
return S}
const P=id=>S.patients.find(p=>p.id==id),done=()=>{save();render()},srt=l=>[...l].sort((a,b)=>b.date>a.date?1:b.date<a.date?-1:b.id-a.id);
const md=h=>{$('#m').innerHTML='<div class="md">'+h+'</div>';$('#m').classList.add('on')},cm=()=>$('#m').classList.remove('on');
const tt=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(tt.h);tt.h=setTimeout(()=>t.style.display='none',2200)};
const tc={'محجوز':'','حضر':'w','انتهى':'o','ألغى':'e','لم يحضر':'e'};
const po=s=>S.patients.map(p=>`<option value="${p.id}" ${p.id==s?'selected':''}>${esc(p.name)}</option>`).join('');
const sa=(id,st)=>{S.appts.find(a=>a.id==id).status=st;done()};
const apptList=l=>l.length?`<div class="tw"><table>${l.map(a=>{const p=P(a.pid)||{};return `<tr><td>${a.time}</td><td><b>${esc(p.name)}</b><br><small>${a.type}</small></td><td><span class="tg ${tc[a.status]}">${a.status}</span></td><td><div class="rw">${a.status=='محجوز'?`<button class="bt s x" onclick="sa(${a.id},'حضر')">وصل</button><button class="bt s x" onclick="sa(${a.id},'لم يحضر')">لم يحضر</button><button class="bt d x" onclick="sa(${a.id},'ألغى')">إلغاء</button>`:''}${a.status=='حضر'?`<button class="bt x" onclick="vf(${a.pid},${a.id})">تحصيل وفاتورة</button>`:''}</div></td></tr>`}).join('')}</table></div>`:'<p style="color:var(--mu)">لا توجد مواعيد في هذا اليوم. اضغط «موعد جديد» لإضافة حجز.</p>';
const dayA=d=>S.appts.filter(a=>a.date==d).sort((a,b)=>a.time>b.time?1:-1);
function dash(){const td=iso(0),rev=d=>S.visits.filter(v=>v.date==d).reduce((s,v)=>s+v.paid,0),days=[...Array(7)].map((_,i)=>iso(i-6)),vals=days.map(rev),mx=Math.max(...vals,1),mo=S.visits.filter(v=>v.date.slice(0,7)==td.slice(0,7)).reduce((s,v)=>s+v.paid,0);
return `<div class="g g4">${[['📅','مواعيد اليوم',dayA(td).length],['🧑‍🤝‍🧑','إجمالي المرضى',S.patients.length],['💰','إيراد اليوم',money(rev(td))],['📈','إيراد الشهر',money(mo)]].map(x=>`<div class="c st"><i>${x[0]}</i><div><small>${x[1]}</small><b>${x[2]}</b></div></div>`).join('')}</div>
<div class="g g2" style="margin-top:16px"><div class="c"><h3>الإيراد آخر ٧ أيام</h3><div class="bar">${vals.map((v,i)=>`<div>${v||''}<span style="height:${v/mx*80}%"></span>${days[i].slice(5)}</div>`).join('')}</div></div><div class="c"><h3>طابور اليوم</h3>${apptList(dayA(td))}</div></div>`}
const plist=()=>{const l=S.patients.filter(p=>(p.name+p.phone).includes(q));return `<div class="c tw"><table><tr><th>الاسم</th><th>السن</th><th>التليفون</th><th>ملاحظات</th><th>آخر زيارة</th></tr>${l.map(p=>`<tr class="k" onclick="pp(${p.id})"><td><b>${esc(p.name)}</b></td><td>${p.age}</td><td>${esc(p.phone)}</td><td>${p.notes?`<span class="tg w">${esc(p.notes)}</span>`:'—'}</td><td>${S.visits.filter(v=>v.pid==p.id).map(v=>v.date).sort().pop()||'—'}</td></tr>`).join('')||'<tr><td>لا يوجد مريض بهذا الاسم</td></tr>'}</table></div>`};
const pts=()=>`<div class="rw" style="margin-bottom:14px"><input placeholder="🔍 ابحث بالاسم أو التليفون" value="${esc(q)}" oninput="q=this.value;$('#pl').innerHTML=plist()" style="flex:1;min-width:200px;width:auto"><button class="bt" onclick="pf()">+ مريض جديد</button></div><div id="pl">${plist()}</div>`;
const pf=id=>{const p=id?P(id):{};md(`<h3>${id?'تعديل بيانات المريض':'مريض جديد'}</h3><div class="f"><div class="w"><label>الاسم</label><input id="a1" value="${esc(p.name)}"></div><div><label>السن</label><input id="a2" type="number" value="${p.age??''}"></div><div><label>النوع</label><select id="a3"><option>ذكر<option ${p.sex=='أنثى'?'selected':''}>أنثى</select></div><div class="w"><label>التليفون</label><input id="a4" value="${esc(p.phone)}"></div><div class="w"><label>ملاحظات</label><textarea id="a5" rows="2">${esc(p.notes)}</textarea></div></div><div class="rw" style="margin-top:14px"><button class="bt" onclick="sp(${id||0})">حفظ</button><button class="bt s" onclick="cm()">إلغاء</button></div>`)};
const sp=id=>{const n=$('#a1').value.trim();if(!n)return tt('اكتب اسم المريض');const o={name:n,age:+$('#a2').value||0,sex:$('#a3').value,phone:$('#a4').value,notes:$('#a5').value};if(id)Object.assign(P(id),o);else S.patients.push({id:++S.n,...o});cm();done();tt('تم حفظ المريض')};
const dp=(id,b)=>{if(!b.dataset.c){b.dataset.c=1;b.textContent='اضغط للتأكيد';return}S.patients=S.patients.filter(p=>p.id!=id);S.appts=S.appts.filter(a=>a.pid!=id);S.visits=S.visits.filter(v=>v.pid!=id);cm();done();tt('تم حذف المريض')};
const pp=id=>{const p=P(id),vs=srt(S.visits.filter(v=>v.pid==id)),tot=vs.reduce((s,v)=>s+v.paid,0);md(`<div class="rw"><div class="av">${esc(p.name[0])}</div><div style="flex:1"><h3 style="margin:0">${esc(p.name)}</h3><small>${p.age} سنة · ${p.sex} · ${esc(p.phone)}</small></div></div>${p.notes?`<p><span class="tg w">${esc(p.notes)}</span></p>`:''}<div class="rw"><button class="bt" onclick="vf(${id})">+ فاتورة جديدة</button><button class="bt s" onclick="pf(${id})">تعديل</button><button class="bt d" onclick="dp(${id},this)">حذف</button></div><h4 style="margin-top:16px">الفواتير (${vs.length}) · إجمالي المدفوع ${money(tot)}</h4>${vs.map(v=>`<div class="tl"><b>${v.date}</b> — ${esc(v.items.map(i=>i.n).join('، '))} · ${v.fee} ج.م <button class="bt s x" onclick="rc(${v.id})">إيصال</button></div>`).join('')||'<small>لا توجد فواتير بعد.</small>'}`)};
const apt=()=>`<div class="rw" style="margin-bottom:14px"><input type="date" value="${ad}" onchange="ad=this.value;render()" style="width:auto"><button class="bt" onclick="af()">+ موعد جديد</button></div><div class="c">${apptList(dayA(ad))}</div>`;
const af=()=>md(`<h3>موعد جديد</h3><div class="f"><div class="w"><label>المريض</label><select id="b1">${po()}</select></div><div><label>التاريخ</label><input id="b2" type="date" value="${ad}"></div><div><label>الوقت</label><input id="b3" type="time" value="10:00"></div><div class="w"><label>النوع</label><select id="b4"><option>كشف<option>استشارة<option>متابعة</select></div></div><div class="rw" style="margin-top:14px"><button class="bt" onclick="sb()">حجز الموعد</button><button class="bt s" onclick="cm()">إلغاء</button></div>`);
const sb=()=>{S.appts.push({id:++S.n,pid:+$('#b1').value,date:$('#b2').value,time:$('#b3').value,type:$('#b4').value,status:'محجوز'});cm();done();tt('تم حجز الموعد')};

const cs=()=>cart.reduce((s,i)=>s+i.p*i.q,0);
const cr=()=>{const n=Math.max(0,cs()-(+$('#c8').value||0));$('#ct').innerHTML=cart.map((i,k)=>`<div class="rw" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span style="flex:1">${esc(i.n)}</span><button class="bt s x" onclick="cq(${k},-1)">−</button><b>${i.q}</b><button class="bt s x" onclick="cq(${k},1)">+</button><span style="width:70px;text-align:end">${i.p*i.q}</span></div>`).join('')||'<small>اختار الخدمات من فوق</small>';$('#tt').textContent=money(n);if(!pt)$('#c7').value=n};
const ca=k=>{const s=S.svc[k],i=cart.find(x=>x.n==s.n);i?i.q++:cart.push({n:s.n,p:s.p,q:1});cr()},cq=(k,d)=>{cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);cr()};
const vf=(pid,aid)=>{cart=[];pt=0;md(`<h3>فاتورة جديدة</h3><div class="f"><div class="w"><label>المريض</label><select id="c1">${po(pid)}</select></div></div><h4 style="margin-top:12px">الخدمات</h4><div class="rw">${S.svc.map((s,k)=>`<button class="bt s" onclick="ca(${k})">${esc(s.n)} · ${s.p}</button>`).join('')}</div><div id="ct" style="margin:12px 0"></div><div class="f"><div><label>خصم</label><input id="c8" type="number" value="0" oninput="cr()"></div><div><label>طريقة الدفع</label><select id="c9"><option>نقدي<option>فيزا<option>تحويل</select></div><div><label>المدفوع</label><input id="c7" type="number" oninput="pt=1"></div><div><label>الإجمالي</label><b id="tt" style="font-size:20px;color:var(--p)"></b></div></div><div class="rw" style="margin-top:14px"><button class="bt" onclick="sv(${aid||0})">تحصيل وطباعة الإيصال</button><button class="bt s" onclick="cm()">إلغاء</button></div>`);cr()};
const sv=aid=>{if(!cart.length)return tt('اختار خدمة واحدة على الأقل');const d=+$('#c8').value||0,n=Math.max(0,cs()-d),v={id:++S.n,pid:+$('#c1').value,date:iso(0),items:cart,disc:d,m:$('#c9').value,fee:n,paid:Math.min(n,+$('#c7').value||0)};S.visits.push(v);const a=S.appts.find(x=>x.id==aid);if(a)a.status='انتهى';done();rc(v.id)};
const rc=id=>{const v=S.visits.find(x=>x.id==id),p=P(v.pid)||{},r=v.fee-v.paid,R=(a,b,c='')=>`<tr><td>${a}</td><td style="text-align:end;${c}">${b}</td></tr>`;md(`<div style="text-align:center;border-bottom:3px solid var(--p);padding-bottom:8px"><h2 style="margin:0;color:var(--p)">${esc(S.clinic)}</h2><small>إيصال رقم #${v.id} · ${v.date}</small></div><p><b>المريض:</b> ${esc(p.name)}</p><table>${v.items.map(i=>R(esc(i.n)+' × '+i.q,i.p*i.q)).join('')}${v.disc?R('خصم','-'+v.disc):''}${R('<b>الإجمالي</b>','<b>'+v.fee+'</b>')}${R('المدفوع ('+(v.m||'نقدي')+')',v.paid)}${r?R('المتبقي',r,'color:var(--er)'):''}</table><p style="text-align:center"><small>شكرًا لزيارتكم</small></p><div class="rw nb"><button class="bt" onclick="print()">🖨️ طباعة</button><button class="bt s" onclick="cm()">إغلاق</button></div>`)};

const cl=id=>{const v=S.visits.find(x=>x.id==id);v.paid=v.fee;done();tt('تم التحصيل')};
const vt=l=>`<div class="c tw"><table><tr><th>#</th><th>التاريخ</th><th>المريض</th><th>الخدمات</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th></th></tr>${l.map(v=>{const r=v.fee-v.paid;return `<tr><td>${v.id}</td><td>${v.date}</td><td>${esc((P(v.pid)||{}).name)}</td><td>${esc(v.items.map(i=>i.n+(i.q>1?' ×'+i.q:'')).join('، '))}</td><td>${v.fee}</td><td>${v.paid}</td><td>${r?`<span class="tg e">${r}</span> <button class="bt x" onclick="cl(${v.id})">تحصيل</button>`:'<span class="tg o">مسدد</span>'}</td><td><button class="bt s x" onclick="rc(${v.id})">إيصال</button></td></tr>`}).join('')||'<tr><td>لا توجد فواتير</td></tr>'}</table></div>`;
const vis=()=>`<div style="margin-bottom:14px"><button class="bt" onclick="vf(0)">+ فاتورة جديدة</button></div>`+vt(srt(S.visits));
const bil=()=>{const T=S.visits.filter(v=>v.date==iso(0)),sm=m=>money(T.filter(v=>(v.m||'نقدي')==m).reduce((s,v)=>s+v.paid,0)),d=S.visits.reduce((s,v)=>s+v.fee-v.paid,0);return `<div class="g g4">${[['💵','نقدي اليوم',sm('نقدي')],['💳','فيزا اليوم',sm('فيزا')],['🏦','تحويل اليوم',sm('تحويل')],['⏳','مستحقات متبقية',money(d)]].map(x=>`<div class="c st"><i>${x[0]}</i><div><small>${x[1]}</small><b>${x[2]}</b></div></div>`).join('')}</div><h3 style="margin:18px 0 10px">مستحقات على المرضى</h3>`+vt(srt(S.visits.filter(v=>v.fee>v.paid)))};
const svv=()=>`<div style="margin-bottom:14px"><button class="bt" onclick="sf()">+ خدمة جديدة</button></div><div class="c tw"><table><tr><th>الخدمة</th><th>السعر</th><th></th></tr>${S.svc.map((s,k)=>`<tr><td>${esc(s.n)}</td><td>${s.p}</td><td><button class="bt s x" onclick="sf(${k})">تعديل</button> <button class="bt d x" onclick="ds(${k},this)">حذف</button></td></tr>`).join('')}</table></div>`;
const sf=k=>{const s=S.svc[k]||{};md(`<h3>${s.n?'تعديل خدمة':'خدمة جديدة'}</h3><div class="f"><div><label>اسم الخدمة</label><input id="e1" value="${esc(s.n)}"></div><div><label>السعر</label><input id="e2" type="number" value="${s.p??''}"></div></div><div class="rw" style="margin-top:14px"><button class="bt" onclick="ss(${k??-1})">حفظ</button><button class="bt s" onclick="cm()">إلغاء</button></div>`)};
const ss=k=>{const n=$('#e1').value.trim();if(!n)return tt('اكتب اسم الخدمة');const o={n,p:+$('#e2').value||0};k>=0?S.svc[k]=o:S.svc.push(o);cm();done()};
const ds=(k,b)=>{if(!b.dataset.c){b.dataset.c=1;b.textContent='تأكيد؟';return}S.svc.splice(k,1);done()};
const nav=[['d','📊','لوحة التحكم'],['p','🧑‍🤝‍🧑','المرضى'],['a','📅','المواعيد'],['v','🧾','الفواتير'],['b','💰','الحسابات'],['s','🏷️','الخدمات والأسعار']],V={d:['لوحة التحكم',dash],p:['المرضى',pts],a:['المواعيد',apt],v:['الفواتير',vis],b:['الحسابات',bil],s:['الخدمات والأسعار',svv]};
function render(){$('#cn').textContent=S.clinic;$('#nav').innerHTML=nav.map(n=>`<button class="nv ${n[0]==cur?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b><span>${n[2]}</span></button>`).join('');$('#ti').textContent=V[cur][0];$('#v').innerHTML=V[cur][1]()}
const go=k=>{cur=k;$('#app').classList.remove('open');render()},tg=()=>$('#app').classList.toggle(innerWidth<800?'open':'col'),th=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'},rs=()=>{seed();done();tt('تمت إعادة البيانات التجريبية')};
$('#dt').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
(async()=>{S=await load();if(!S||!S.patients||!S.svc){seed();save()}render()})();
if('serviceWorker' in navigator&&location.protocol!='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
